<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChitrChatr - Chat Room</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-decor">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
    </div>

    <!-- Hidden element to store current user's name for JS retrieval -->
    <div id="current-user" data-username="{{ username }}" style="display: none;"></div>

    <main class="chat-container fade-in">
        <!-- Chat Header -->
        <header class="chat-header">
            <div class="header-left">
                <span class="chat-logo">💬</span>
                <h2>Chit Chat Room</h2>
                <div id="db-status-badge" class="status-badge status-loading">
                    <span class="status-dot"></span>
                    <span class="status-text">Connecting...</span>
                </div>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <span class="avatar">{{ username[0] | upper }}</span>
                    <span class="profile-name">@{{ username }}</span>
                </div>
                <a href="{{ url_for('logout') }}" class="btn btn-outline btn-sm" id="leave-btn">
                    <span>Leave</span>
                </a>
            </div>
        </header>

        <!-- Database Offline Warning Bar -->
        <div id="db-offline-alert" class="alert-bar alert-hidden">
            <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Database is offline. Messages cannot be retrieved or sent.</span>
        </div>

        <!-- Chat Feed -->
        <section class="chat-window" id="chat-window">
            <div class="loading-messages">
                <div class="spinner"></div>
                <p>Loading messages...</p>
            </div>
        </section>

        <!-- Message Input Bar -->
        <footer class="chat-footer">
            <form id="chat-form" class="chat-form">
                <div class="input-container">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Type a message..." 
                        autocomplete="off" 
                        maxlength="1000"
                        required
                    >
                </div>
                <button type="submit" id="send-btn" class="btn btn-primary btn-icon-only">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </main>

    <!-- JS Scripts -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
