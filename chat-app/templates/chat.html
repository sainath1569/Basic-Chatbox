<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chit-Chat Room</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-decor">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
    </div>

    <!-- Hidden element to store current user's name for JS retrieval -->
    <div id="current-user" data-username="{{ username }}" style="display: none;"></div>

    <main class="chat-container fade-in">
        <!-- Chat Header -->
        <header class="chat-header">
            <div class="header-left">
                <span class="chat-logo">💬</span>
                <h2>Chit Chat Room</h2>
                <div id="db-status-badge" class="status-badge status-loading">
                    <span class="status-dot"></span>
                    <span class="status-text">Connecting...</span>
                </div>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <span class="avatar">{{ username[0] | upper }}</span>
                    <span class="profile-name">@{{ username }}</span>
                </div>
                <button id="notification-btn" class="btn btn-outline btn-sm btn-icon-only" title="Enable Notifications" style="width: 2.2rem; height: 2.2rem; display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 1rem; height: 1rem;">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>
                <a href="{{ url_for('logout') }}" class="btn btn-outline btn-sm" id="leave-btn" title="Leave Chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="leave-icon" style={{ width: "1rem", height: "1rem" }}>
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span class="leave-text">Leave</span>
                </a>
            </div>
        </header>

        <!-- Database Offline Warning Bar -->
        <div id="db-offline-alert" class="alert-bar alert-hidden">
            <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Database is offline. Messages cannot be retrieved or sent.</span>
        </div>

        <!-- Chat Feed -->
        <section class="chat-window" id="chat-window">
            <div class="loading-messages">
                <div class="spinner"></div>
                <p>Loading messages...</p>
            </div>
        </section>

        <!-- Message Input Bar -->
        <footer class="chat-footer">
            <!-- File Attachment Preview -->
            <div id="file-preview-container" class="file-preview-container preview-hidden">
                <div class="file-preview-content">
                    <span class="file-preview-icon">📎</span>
                    <div class="file-preview-details">
                        <span id="preview-filename" class="preview-filename">file.pdf</span>
                        <span id="preview-filesize" class="preview-filesize">24 KB</span>
                    </div>
                    <button type="button" id="cancel-file-btn" class="cancel-file-btn" title="Remove attachment">&times;</button>
                </div>
            </div>

            <form id="chat-form" class="chat-form">
                <input 
                    type="file" 
                    id="file-input" 
                    style="display: none;" 
                    accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt"
                >
                <button type="button" id="attach-btn" class="btn btn-outline btn-icon-only attach-btn" title="Attach file">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 1.1rem; height: 1.1rem;">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <div class="input-container">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Type a message..." 
                        autocomplete="off" 
                        maxlength="1000"
                    >
                </div>
                <button type="submit" id="send-btn" class="btn btn-primary btn-icon-only">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </main>

    <!-- Image Zoom Modal -->
    <div id="image-modal" class="modal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modal-img" alt="Zoomed view">
        <div id="modal-caption"></div>
    </div>

    <!-- JS Scripts -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
