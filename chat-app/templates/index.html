<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChitrChatr - Join Chat</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-decor">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
    </div>
    
    <main class="login-container">
        <div class="glass-card fade-in">
            <header class="app-header">
                <div class="logo">
                    <span class="logo-icon">💬</span>
                    <h1>ChitrChatr</h1>
                </div>
                <p class="subtitle">Connect instantly, chat securely.</p>
            </header>
            
            <form action="{{ url_for('index') }}" method="POST" id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Choose your username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">@</span>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="e.g. wanderer" 
                            required 
                            autocomplete="off"
                            maxlength="30"
                        >
                    </div>
                    <span id="validation-error" class="error-text">
                        {% if error_msg %}{{ error_msg }}{% endif %}
                    </span>
                </div>
                
                <button type="submit" id="join-btn" class="btn btn-primary">
                    <span>Enter Chat Room</span>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <script>
        // Inline validation logic for quick feedback
        const form = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const errorText = document.getElementById('validation-error');

        form.addEventListener('submit', (e) => {
            const username = usernameInput.value.trim();
            if (!username) {
                e.preventDefault();
                errorText.textContent = "Username cannot be blank or contain only spaces.";
                usernameInput.classList.add('input-error');
            } else if (username.length > 30) {
                e.preventDefault();
                errorText.textContent = "Username must be 30 characters or less.";
                usernameInput.classList.add('input-error');
            } else {
                errorText.textContent = "";
                usernameInput.classList.remove('input-error');
            }
        });

        usernameInput.addEventListener('input', () => {
            if (usernameInput.value.trim()) {
                usernameInput.classList.remove('input-error');
                errorText.textContent = "";
            }
        });
    </script>
</body>
</html>
